<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Control de Insumos – Usulután</title>
<style>
:root{--bg:#f2f3f6;--card:#fff;--tx:#313945;--mu:#5f6877;--bd:#d2d2d2;--ac:#111E60;--hi:#e8ebf5;--ok:#2F8F6B;--wa:#B07A00;--cr:#B3261E;--side:#111E60;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1322;--card:#161c30;--tx:#e4e7ee;--mu:#9aa3b7;--bd:#2d3550;--ac:#a9b8f5;--hi:#1f2744;--side:#0a1042;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
#app{display:flex;min-height:100vh}#side{width:230px;flex:none;background:var(--side);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;border-right:4px solid #313945}
#side h1{font-size:15px;margin:0 6px 4px;line-height:1.3}#side .s{color:#c3c9e3;margin:0 6px 16px;font-size:11px}
#side a{display:block;color:#e6e9f7;text-decoration:none;padding:9px 10px;border-radius:8px;margin-bottom:3px;font-size:13px}#side a:hover{background:rgba(255,255,255,.12)}#side a.on{background:#fff;color:#111E60;font-weight:700}
#mw{flex:1;min-width:0}#bar{display:none;position:sticky;top:0;z-index:20;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 14px}#bar button{font-size:18px;background:var(--side)}
main{padding:20px 22px 40px;max-width:1280px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:6px;margin-bottom:14px;border-bottom:2px solid var(--ac);padding-bottom:8px}.hd h2{margin:0;font-size:22px;color:var(--ac)}.sub{color:var(--mu);font-size:12px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}.k .c{border-top:3px solid var(--ac)}.k b{display:block;font-size:24px;color:var(--ac);line-height:1.2}.k small{color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px;margin-bottom:12px}.c h3{font-size:14px;margin:0 0 8px;color:var(--ac)}
.sc{overflow:auto;max-height:70vh}table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}th{color:var(--ac);position:sticky;top:0;background:var(--card);z-index:1;white-space:nowrap}td.nm{min-width:240px}.r{text-align:right}.neg{color:var(--cr);font-weight:700}
.p{padding:2px 8px;border-radius:99px;font-size:11px;color:#fff;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;font-size:13px}td input[type=number]{width:78px}td input.w{width:100%;min-width:220px}
button{background:var(--ac);color:var(--card);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}button.sec{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.d{background:var(--cr);color:#fff}
#bar button{color:#fff}.hm td:first-child,.hm th:first-child{position:sticky;left:0;background:var(--card);z-index:2}.hm td:not(:first-child){text-align:center}.z{background:var(--hi)}
@media(max-width:860px){#side{position:fixed;left:0;top:0;bottom:0;z-index:40;width:270px;transform:translateX(-105%);transition:transform .2s}body.open #side{transform:none}#bar{display:flex}main{padding:14px}}
</style></head><body><div id="app"><aside id="side"><h1>Control de Insumos<br>Sede Santiago de María – Usulután</h1><div class="s" id="ss"></div><nav></nav></aside>
<div id="mw"><div id="bar"><button id="mt" aria-label="Menú">☰</button><b id="bt"></b></div><main id="main"></main></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KEY='inv_usulutan_v1',SEED={"items":[{"id":1,"n":"Alcohol gel a base de alcohol etilico e isopropilico, grado de alcohol de 65%, presentación de 500 ml., con válvula dispensadora (Bote)","o":0,"p":2},{"id":2,"n":"Arranca grasa","o":0,"p":0},{"id":3,"n":"Azúcar blanca, presentación de 2 libras","o":5,"p":2},{"id":4,"n":"Bolsa de detergente en polvo de 750 gramos","o":3,"p":3},{"id":5,"n":"Bolsas Plásticas para basura jardineras (5 unidades)","o":0,"p":3},{"id":6,"n":"Bote Ajax (12 onzas)","o":1,"p":0},{"id":7,"n":"Café tostado y molido, (Libra)","o":12,"p":0},{"id":8,"n":"Cepillo de mano para limpieza o mascones","o":2,"p":3},{"id":9,"n":"Cepillo para inodoro tipo hisopo","o":0,"p":0},{"id":10,"n":"Conos de papel 200 unid. DE 4.5 oz","o":4,"p":0},{"id":11,"n":"Cucharas plásticas desechables pequeñas color blanco (Paquete 25 unidades)","o":0,"p":1},{"id":12,"n":"Desinfectante para piso (Galón)","o":3,"p":0},{"id":13,"n":"Desodorante ambiental Spay 225gr. (LYSOL) (Botella con contenido de 19 onzas como minimo)","o":1,"p":0},{"id":14,"n":"Escoba de cerdas suaves","o":1,"p":0},{"id":15,"n":"Franelas","o":4,"p":0},{"id":16,"n":"Guantes de limpieza","o":0,"p":4},{"id":17,"n":"Insecticida aerosol DE 400 ML. - Spray (uso exclusivo de mtto. ) Mata cucarachas","o":2,"p":0},{"id":18,"n":"Jabón liquido para manos antibacterial (Galón)","o":1,"p":0},{"id":19,"n":"Lejía en presentación de galón","o":3,"p":0},{"id":20,"n":"Manta de Trapeadores","o":1,"p":2},{"id":21,"n":"Mascones verdes 6*4* Ó 15cm*10cm","o":2,"p":3},{"id":22,"n":"Palo de trapeador incluyendo manta","o":1,"p":0},{"id":23,"n":"Papel jumbo roll","o":1,"p":0},{"id":24,"n":"Paquetes de 10 Bolsas plásticas de 19\"x27\" color negro","o":6,"p":5},{"id":25,"n":"Pastillas (ambientales), para inodoro","o":1,"p":0},{"id":26,"n":"Pilas alcalinas AA","o":0,"p":0},{"id":27,"n":"Pilas alcalinas AAA","o":0,"p":0},{"id":28,"n":"Plumones punto grueso P/Pizarra","o":0,"p":0},{"id":29,"n":"Rollo de papel toalla tipo mayordomo (Unidad)","o":9,"p":0},{"id":30,"n":"Rollos de papel toalla (bobina) para secado de manos","o":0,"p":1},{"id":31,"n":"Vasos de cartón descartables de 25 unidades","o":24,"p":5},{"id":32,"n":"Papel Higienico Unidades P/ Personal De Campo","o":58,"p":25},{"id":33,"n":"Agua Botellitas","o":300,"p":390},{"id":34,"n":"Garrafon de agua Castle Pure","o":4,"p":12},{"id":35,"n":"Pan","o":101,"p":390}],"mov":{"2026-10-19":{"3":[3,0],"7":[6,0],"11":[3,0],"32":[56,0],"33":[360,228],"34":[12,0],"35":[120,41]},"2026-10-20":{"33":[0,72],"34":[0,2],"35":[0,60]},"2026-10-21":{"7":[0,1],"33":[0,72],"34":[0,1],"35":[700,75]},"2026-10-22":{"7":[0,1],"33":[0,72],"34":[0,1],"35":[0,70]},"2026-10-23":{"7":[0,1],"32":[0,30],"33":[384,72],"35":[0,60]},"2026-10-24":{"7":[0,1],"33":[0,80],"35":[0,65]},"2026-10-26":{"33":[0,72],"35":[0,70]},"2026-10-27":{"33":[0,72],"34":[0,1],"35":[0,86]},"2026-10-28":{"33":[0,72],"34":[0,1],"35":[0,80]},"2026-10-29":{"32":[120,0],"33":[432,80],"34":[0,1],"35":[0,85]},"2026-10-30":{"33":[0,70],"34":[0,1],"35":[0,90]},"2026-10-31":{"33":[0,70],"34":[0,1],"35":[0,90]}}},$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=load(),cur='resumen',F={q:'',f:''};const VW={};
function load(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return init()}
function init(){const o=JSON.parse(JSON.stringify(SEED));o.sel=Object.keys(o.mov).sort().pop();return o}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const D=()=>Object.keys(S.mov).sort(),LAST=()=>D().pop(),fd=d=>d.split('-').reverse().join('/'),fs=d=>fd(d).slice(0,5);
const mv=(d,id)=>(S.mov[d]&&S.mov[d][id])||[0,0],item=id=>S.items.find(x=>x.id==id);
function bal(id,upto){let v=+item(id).o||0;for(const d of D()){if(d>upto)break;const m=mv(d,id);v+=m[0]-m[1]}return v}
const st=(it,v)=>v<=0?['Agotado','cr']:it.p>0?['Pedir','wa']:['Ok','ok'],pill=(it,v)=>{const[t,k]=st(it,v);return`<span class="p" style="background:var(--${k})">${t}</span>`};
const head=(t,s)=>`<div class="hd"><h2>${t}</h2><span class="sub">${s||''}</span></div>`;
const kp=a=>`<div class="k">${a.map(x=>`<div class="c"><small>${x[0]}</small><b>${x[1]}</b><small>${x[2]||''}</small></div>`).join('')}</div>`;
const tb=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="sub">Sin elementos.</td></tr>`}</table></div>`;
const num=(v,a)=>`<input type="number" min="0" value="${v}" ${a}>`;

VW.resumen=()=>{const L=LAST(),R=S.items.map(i=>({i,v:bal(i.id,L)})),ag=R.filter(r=>r.v<=0),pe=R.filter(r=>r.i.p>0),mo=S.items.filter(i=>mv(L,i.id).some(x=>x)).length;
 $('#main').innerHTML=head('Resumen del inventario','Corte al '+fd(L))+kp([['Productos',S.items.length],['Agotados',ag.length,'Existencia en 0 o menos'],['Con pedido sugerido',pe.length],['Con movimiento',mo,'el '+fd(L)]])+
 `<div class="g"><div class="c"><h3>Agotados</h3>${tb(['Producto','Pedido'],ag.map(r=>[esc(r.i.n),r.i.p]))}</div><div class="c"><h3>Por pedir</h3>${tb(['Producto','Existencia','Pedido'],pe.map(r=>[esc(r.i.n),r.v,`<b>${r.i.p}</b>`]))}</div></div>`};

VW.control=()=>{const ds=D();if(!S.mov[S.sel])S.sel=ds[ds.length-1];const nx=new Date(Date.parse(ds[ds.length-1])+864e5).toISOString().slice(0,10);
 $('#main').innerHTML=head('Control diario','Registra entradas y salidas; la existencia se calcula sola')+`<div class="tools"><span class="sub">Día</span><select id="ds">${ds.map(d=>`<option value="${d}" ${d==S.sel?'selected':''}>${fd(d)}</option>`).join('')}</select><button class="sec" id="dd">Eliminar día</button><span class="sub">|</span><input type="date" id="nd" value="${nx}"><button id="ad">Agregar día</button></div>
 <div class="tools"><input id="q" placeholder="Buscar producto…" value="${esc(F.q)}"><select id="fl"><option value="">Todos</option><option value="ag">Agotados</option><option value="pe">Con pedido</option><option value="mv">Con movimiento</option></select></div><div class="c"><div class="sc"><table><thead><tr><th>N°</th><th>Producto</th><th class="r">Inicio</th><th>Entradas</th><th>Salidas</th><th class="r">Existencia</th><th>Estado</th></tr></thead><tbody id="tc"></tbody></table></div></div>`;
 $('#fl').value=F.f;fill()};
function fill(){const d=S.sel,q=F.q.toLowerCase();$('#tc').innerHTML=S.items.map((it,n)=>{const m=mv(d,it.id),c=bal(it.id,d);if(q&&!it.n.toLowerCase().includes(q))return'';if(F.f=='ag'&&c>0||F.f=='pe'&&!(it.p>0)||F.f=='mv'&&!(m[0]||m[1]))return'';
 return`<tr data-id="${it.id}"><td>${n+1}</td><td class="nm">${esc(it.n)}</td><td class="r">${c-m[0]+m[1]}</td><td>${num(m[0],'data-f="0"')}</td><td>${num(m[1],'data-f="1"')}</td><td class="r ${c<0?'neg':''}"><b>${c}</b></td><td>${pill(it,c)}</td></tr>`}).join('')}
function refRow(tr){const id=tr.dataset.id,m=mv(S.sel,id),c=bal(id,S.sel);tr.children[2].textContent=c-m[0]+m[1];tr.children[5].className='r '+(c<0?'neg':'');tr.children[5].innerHTML=`<b>${c}</b>`;tr.children[6].innerHTML=pill(item(id),c)}

VW.historial=()=>{const ds=D();$('#main').innerHTML=head('Historial de existencias','Existencia al cierre de cada día')+`<div class="c"><div class="sc"><table class="hm"><tr><th>Producto</th><th>Inicial</th>${ds.map(d=>`<th>${fs(d)}</th>`).join('')}</tr>${S.items.map(it=>`<tr><td>${esc(it.n)}</td><td class="z">${it.o}</td>${ds.map(d=>{const v=bal(it.id,d);return`<td class="${v<=0?'neg':''}">${v}</td>`}).join('')}</tr>`).join('')}</table></div></div>`};

VW.pedido=()=>{const L=LAST();$('#main').innerHTML=head('Pedido sugerido','Existencia al '+fd(L))+`<div class="tools"><select id="pf"><option value="">Todos los productos</option><option value="1">Solo con pedido</option></select><button id="xp">Descargar pedido (Excel)</button></div><div class="c"><div class="sc"><table><thead><tr><th>N°</th><th>Producto</th><th class="r">Existencia</th><th>Pedido sugerido</th><th>Estado</th></tr></thead><tbody id="tp"></tbody></table></div></div>`;$('#pf').value=F.p||'';fp()};
function fp(){const L=LAST();$('#tp').innerHTML=S.items.map((it,n)=>{if(F.p&&!(it.p>0))return'';const v=bal(it.id,L);return`<tr data-id="${it.id}"><td>${n+1}</td><td class="nm">${esc(it.n)}</td><td class="r">${v}</td><td>${num(it.p,'data-f="p"')}</td><td>${pill(it,v)}</td></tr>`}).join('')}

VW.productos=()=>{$('#main').innerHTML=head('Productos','Nombre, existencia inicial y altas/bajas')+`<div class="c" style="margin-bottom:12px"><div class="tools"><input id="nn" class="w" placeholder="Nombre del nuevo producto" style="min-width:260px"><input id="no" type="number" min="0" value="0" style="width:90px" title="Existencia inicial"><button id="np">Agregar producto</button></div></div><div class="c"><div class="sc"><table><thead><tr><th>N°</th><th>Producto</th><th>Existencia inicial</th><th></th></tr></thead><tbody>${S.items.map((it,n)=>`<tr data-id="${it.id}"><td>${n+1}</td><td><input class="w" data-f="n" value="${esc(it.n)}"></td><td>${num(it.o,'data-f="o"')}</td><td><button class="sec" data-del="1">Eliminar</button></td></tr>`).join('')}</tbody></table></div></div>`};

VW.datos=()=>{$('#main').innerHTML=head('Datos y respaldo')+`<div class="g"><div class="c"><h3>Respaldo en Excel</h3><p class="sub">Los cambios se guardan automáticamente en este navegador. Descarga un Excel con frecuencia como respaldo.</p><div class="tools"><button id="xe">Exportar Excel</button><button class="sec" id="xi">Importar Excel…</button><input type="file" id="xf" accept=".xlsx,.xls" hidden></div><p class="sub">Al importar se usa el formato de la hoja «CONTROL DE INSUMOS» (columnas «Entradas dd/mm/aaaa» y «Salidas dd/mm/aaaa»).</p></div>
 <div class="c"><h3>Notas sobre los datos originales</h3><p class="sub">En el Excel, el TOTAL del 19/10 no descontaba las salidas de ese día (Pan 41 y Agua 228). Aquí sí se descuentan, por lo que Pan y Agua difieren del Excel. La salida de Agua del 19/10 viene de la fórmula «=Existencias−72»; revísala si no es correcta.</p><button class="d" id="rs">Restaurar datos originales</button></div></div>`};

function xl(){if(!window.XLSX)return alert('No se cargó la librería de Excel (¿sin conexión?).');const ds=D(),h=['N°','Producto','Existencia inicial','Pedido sugerido'];ds.forEach(d=>h.push('Entradas '+fd(d),'Salidas '+fd(d),'Total '+fd(d)));
 const w=XLSX.utils.book_new(),L=LAST();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([h].concat(S.items.map((it,i)=>{const r=[i+1,it.n,it.o,it.p];ds.forEach(d=>{const m=mv(d,it.id);r.push(m[0],m[1],bal(it.id,d))});return r}))),'Control de insumos');
 XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['N°','Producto','Existencia '+fd(L),'Pedido sugerido']].concat(S.items.map((it,i)=>[i+1,it.n,bal(it.id,L),it.p]))),'Pedido');XLSX.writeFile(w,'control_insumos_usulutan_'+L+'.xlsx')}
function imp(f){const r=new FileReader();r.onload=e=>{try{const ws=XLSX.read(e.target.result,{type:'array'}),a=XLSX.utils.sheet_to_json(ws.Sheets[ws.SheetNames[0]],{header:1,defval:0}),hi=a.findIndex(r=>r.some(c=>/nombre del producto/i.test(c)));if(hi<0)throw 0;
 const H=a[hi].map(x=>String(x).trim()),ci=H.findIndex(h=>/^existencia/i.test(h)),cp=H.findIndex(h=>/pedido/i.test(h)),cn=H.findIndex(h=>/nombre del producto/i.test(h)),N={items:[],mov:{}},cols=[];
 H.forEach((h,i)=>{const m=h.match(/^(entradas|salidas)\s+(\d\d)\/(\d\d)\/(\d{4})/i);if(m){const d=m[4]+'-'+m[3]+'-'+m[2];N.mov[d]=N.mov[d]||{};cols.push([i,/^e/i.test(m[1])?0:1,d])}});
 a.slice(hi+1).forEach(r=>{if(typeof r[cn]!='string'||!r[cn])return;const id=N.items.length+1;N.items.push({id,n:r[cn],o:+r[ci]||0,p:+r[cp]||0});cols.forEach(([i,k,d])=>{const v=+r[i]||0;if(v)(N.mov[d][id]=N.mov[d][id]||[0,0])[k]=v})});
 if(!N.items.length||!cols.length)throw 0;if(confirm('Se reemplazarán los datos actuales por los del archivo ('+N.items.length+' productos). ¿Continuar?')){N.sel=Object.keys(N.mov).sort().pop();S=N;save();nav('control')}}catch(x){alert('No se pudo leer el archivo. Usa el formato de la hoja «CONTROL DE INSUMOS».')}};r.readAsArrayBuffer(f)}

const NAV=[['resumen','Resumen'],['control','Control diario'],['historial','Historial'],['pedido','Pedido sugerido'],['productos','Productos'],['datos','Datos y respaldo']];
function nav(k){if(k)cur=k;if(!VW[cur])cur='resumen';$('#side nav').innerHTML=NAV.map(([k,l])=>`<a href="#${k}" data-k="${k}" class="${k==cur?'on':''}">${l}</a>`).join('');$('#bt').textContent=NAV.find(x=>x[0]==cur)[1];$('#ss').textContent='Corte '+fd(LAST());VW[cur]();document.body.classList.remove('open');scrollTo(0,0)}
$('#side').onclick=e=>{const a=e.target.closest('a[data-k]');if(a){e.preventDefault();nav(a.dataset.k)}};$('#mt').onclick=()=>document.body.classList.toggle('open');
const M=$('#main');
M.addEventListener('change',e=>{const t=e.target,tr=t.closest('tr'),f=t.dataset.f;
 if(t.id=='ds'){S.sel=t.value;save();return VW.control()}if(t.id=='fl'){F.f=t.value;return fill()}if(t.id=='pf'){F.p=t.value;return fp()}if(t.id=='xf'&&t.files[0])return imp(t.files[0]);
 if(!tr||f==null)return;const id=tr.dataset.id,it=item(id),v=Math.max(0,+t.value||0);
 if(f=='0'||f=='1'){(S.mov[S.sel][id]=S.mov[S.sel][id]||[0,0])[+f]=v;t.value=v;save();refRow(tr)}
 else if(f=='p'){it.p=v;t.value=v;save();tr.children[4].innerHTML=pill(it,bal(id,LAST()))}
 else if(f=='o'){it.o=v;t.value=v;save()}else if(f=='n'){it.n=t.value.trim()||it.n;t.value=it.n;save()}});
M.addEventListener('input',e=>{if(e.target.id=='q'){F.q=e.target.value;fill()}});
M.addEventListener('click',e=>{const t=e.target,id=t.id;
 if(id=='ad'){const d=$('#nd').value;if(!d)return;if(!S.mov[d])S.mov[d]={};S.sel=d;save();nav('control')}
 else if(id=='dd'){if(D().length<2)return alert('Debe quedar al menos un día.');if(confirm('¿Eliminar los movimientos del '+fd(S.sel)+'?')){delete S.mov[S.sel];S.sel=LAST();save();nav('control')}}
 else if(id=='np'){const n=$('#nn').value.trim();if(!n)return $('#nn').focus();S.items.push({id:Math.max(0,...S.items.map(x=>x.id))+1,n,o:Math.max(0,+$('#no').value||0),p:0});save();nav('productos')}
 else if(t.dataset.del){const id2=t.closest('tr').dataset.id;if(confirm('¿Eliminar «'+item(id2).n+'» y sus movimientos?')){S.items=S.items.filter(x=>x.id!=id2);for(const d in S.mov)delete S.mov[d][id2];save();nav('productos')}}
