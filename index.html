<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Control de Insumos – Usulután</title>
<script>try{var t=localStorage.getItem("inv_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script><style>
:root{--bg:#f2f3f6;--card:#fff;--tx:#313945;--mu:#5f6877;--bd:#d2d2d2;--ac:#111E60;--hi:#e8ebf5;--ok:#2F8F6B;--wa:#B07A00;--cr:#B3261E;--mu2:#6b7280;--side:#111E60;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1322;--card:#161c30;--tx:#e4e7ee;--mu:#9aa3b7;--bd:#2d3550;--ac:#a9b8f5;--hi:#1f2744;--side:#0a1042;color-scheme:dark}}:root[data-theme=dark]{--bg:#0e1322;--card:#161c30;--tx:#e4e7ee;--mu:#9aa3b7;--bd:#2d3550;--ac:#a9b8f5;--hi:#1f2744;--side:#0a1042;color-scheme:dark}:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
#app{display:flex;min-height:100vh}#side{width:230px;flex:none;background:var(--side);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;border-right:4px solid #313945}
#side h1{font-size:15px;margin:0 6px 4px;line-height:1.3}#side .s{color:#c3c9e3;margin:0 6px 16px;font-size:11px}
#side a{display:block;color:#e6e9f7;text-decoration:none;padding:9px 10px;border-radius:8px;margin-bottom:3px;font-size:13px}#side a:hover{background:rgba(255,255,255,.12)}#side a.on{background:#fff;color:#111E60;font-weight:700}
#mw{flex:1;min-width:0}#bar{display:none;position:sticky;top:0;z-index:20;align-items:center;gap:10px;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 14px}#bar button{font-size:18px;background:var(--side)}
main{padding:20px 22px 40px;max-width:1280px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:6px;margin-bottom:14px;border-bottom:2px solid var(--ac);padding-bottom:8px}.hd h2{margin:0;font-size:22px;color:var(--ac)}.sub{color:var(--mu);font-size:12px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}.k .c{border-top:3px solid var(--ac)}.k b{display:block;font-size:24px;color:var(--ac);line-height:1.2}.k small{color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px;margin-bottom:12px}.c h3{font-size:14px;margin:0 0 8px;color:var(--ac)}
.sc{overflow:auto;max-height:70vh}table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}th{color:var(--ac);position:sticky;top:0;background:var(--card);z-index:1;white-space:nowrap}td.nm{min-width:240px}.r{text-align:right}.neg{color:var(--cr);font-weight:700}
.p{padding:2px 8px;border-radius:99px;font-size:11px;color:#fff;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;font-size:13px}td input[type=number]{width:78px}td input.w{width:100%;min-width:220px}
button{background:var(--ac);color:var(--card);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}button.sec{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.d{background:var(--cr);color:#fff}
#bar button{color:#fff}#bar #th2{margin-left:auto;font-size:13px}#th,#lo{display:block;width:calc(100% - 12px);margin:14px 6px 0;background:rgba(255,255,255,.14);color:#fff}.hm td:first-child,.hm th:first-child{position:sticky;left:0;background:var(--card);z-index:2}.hm td:not(:first-child){text-align:center}.z{background:var(--hi)}
@media(max-width:860px){#side{position:fixed;left:0;top:0;bottom:0;z-index:40;width:270px;transform:translateX(-105%);transition:transform .2s}body.open #side{transform:none}#bar{display:flex}main{padding:14px}}
#lg{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#111E60,#313945);overflow:auto}body.in #lg{display:none}body:not(.in) #app{display:none}
.lc{width:100%;max-width:380px;background:var(--card);border-radius:16px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}.lh{background:#fff;border-radius:12px;padding:16px;text-align:center;margin-bottom:16px;min-height:84px;display:flex;align-items:center;justify-content:center}.lh img{max-width:100%;max-height:150px}#lgw{display:none;color:#111E60;font-weight:800;letter-spacing:.5px;line-height:1.3}

const sum=a=>a.reduce((x,y)=>x+y,0),WD=()=>{const ds=D();return F.w?ds.slice(-F.w):ds};

function an(it){const w=WD(),s=w.map(d=>mv(d,it.id)[1]),tot=sum(s),avg=tot/(w.length||1),h=Math.floor(s.length/2),m1=h?sum(s.slice(0,h))/h:0,m2=sum(s.slice(h))/(s.length-h||1),ch=m1>0?(m2-m1)/m1:m2>0?1:0,v=bal(it.id,LAST());

function plot(t,h,lb,o){const W=520,H=180,p=30,pr=o.proj||[],n=h.length+pr.length,mx=Math.max(1,...h,...pr,o.avg||0),X=i=>p+i*(W-2*p)/Math.max(1,n-1),Y=v=>H-24-v*(H-38)/mx;

 else{s+=`<polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${h.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;if(pr.length)s+=`<polyline fill="none" stroke="var(--cr)" stroke-width="2" stroke-dasharray="5 4" points="${[h[h.length-1],...pr].map((v,i)=>X(h.length-1+i)+','+Y(v)).join(' ')}"/>`}
 lb.forEach((l,i)=>{if(i%Math.ceil(n/8)==0)s+=`<text x="${X(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mu)">${l}</text>`});return s+'</svg>'}
function cht(){const it=item(F.t),w=WD(),a=an(it),sal=w.map(d=>mv(d,it.id)[1]),hs=w.map(d=>bal(it.id,d)),pr=[];let v=a.v;if(a.avg>0)for(let k=0;k<30&&v>0;k++){v=Math.max(0,v-a.avg);pr.push(v)}
